# HTTPS in front of the CRM. Caddy obtains and renews a Let's Encrypt certificate
# on its own; the only requirement is that DOMAIN already points at this server.
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# The web container is never published directly; everything goes through Caddy.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # Let's Encrypt notifies this address about expiring certificates
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
