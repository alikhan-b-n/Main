# IconicU CRM: static frontend + API on one domain.
# Put in /etc/nginx/sites-available/iconicu-crm, symlink into sites-enabled,
# then run certbot --nginx -d crm.example.kz, which fills in the TLS lines below.

server {
    listen 80;
    server_name crm.example.kz;

    # certbot adds the redirect to HTTPS here
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name crm.example.kz;

    # certbot fills these in
    # ssl_certificate     /etc/letsencrypt/live/crm.example.kz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/crm.example.kz/privkey.pem;

    # The CRM holds personal data of applicants: no indexing, no framing
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 4m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5185;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5185/health;
        access_log off;
    }

    # Swagger is a development tool — keep it off the public server
    location /swagger {
        return 404;
    }

    # --- Frontend (vite build output) --------------------------------------
    root /opt/iconicu/web;
    index index.html;

    # Hashed assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: any other path is served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
