# Plain HTTP, no certificate — for a first smoke test or a private network.
# Do not expose the CRM to the internet this way: the sign-in token would travel
# unencrypted. For production use docker-compose.tls.yml instead.
#
#   docker compose -f docker-compose.yml -f docker-compose.http.yml up -d --build

services:
  web:
    ports:
      - "${HTTP_PORT:-80}:80"
